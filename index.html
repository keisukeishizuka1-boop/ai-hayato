<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AIハヤト - 音声エンジン事前起動＆ハイパーリンクコンソール</title>
  <style>
    :root {
      --bg-main: #070d19;
      --bg-card: #0e1a30;
      --bg-sub: #081122;
      --border: rgba(0, 240, 255, 0.28);
      --border-strong: rgba(0, 240, 255, 0.6);
      --cyan: #00f0ff;
      --green: #00ffaa;
      --red: #ff4d79;
      --amber: #ffd166;
      --text-main: #eef7ff;
      --text-sub: #88accb;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: calc(10px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
      gap: 10px;
      background-image:
        radial-gradient(circle at 50% 15%, rgba(0, 180, 255, 0.12), transparent 55%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ヘッダー */
    .top-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .status-pill.ready {
      background: rgba(0, 255, 170, 0.14);
      color: var(--green);
      border-color: rgba(0, 255, 170, 0.45);
    }

    .brand-sub {
      font-size: 0.74rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .model-select {
      background: var(--bg-sub);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 38px;
      outline: none;
    }

    .btn {
      border: 1px solid var(--border);
      background: rgba(0, 240, 255, 0.1);
      color: var(--text-main);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      min-height: 38px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.muted {
      background: rgba(255, 77, 121, 0.14);
      border-color: rgba(255, 77, 121, 0.45);
      color: #ff94af;
    }

    .btn.listening {
      background: rgba(255, 209, 102, 0.22);
      border-color: rgba(255, 209, 102, 0.7);
      color: var(--amber);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00b8e6, #1a6dff);
      border-color: transparent;
      color: #ffffff;
    }

    .btn-danger {
      background: rgba(255, 77, 121, 0.14);
      border-color: rgba(255, 77, 121, 0.45);
      color: #ff94af;
    }

    /* 軽量SVGイラスト表示（常時アニメなし・状態変化時のみ切替） */
    .avatar-strip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-svg-box {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      border-radius: 12px;
      background: var(--bg-sub);
      border: 1px solid rgba(0, 240, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .avatar-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .avatar-name {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .avatar-state-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 240, 255, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(0, 240, 255, 0.35);
    }

    .avatar-state-tag.busy {
      background: rgba(255, 209, 102, 0.16);
      color: var(--amber);
      border-color: rgba(255, 209, 102, 0.45);
    }

    .avatar-state-tag.speaking {
      background: rgba(0, 255, 170, 0.16);
      color: var(--green);
      border-color: rgba(0, 255, 170, 0.45);
    }

    .avatar-state-tag.error {
      background: rgba(255, 77, 121, 0.16);
      color: #ff94af;
      border-color: rgba(255, 77, 121, 0.45);
    }

    .avatar-caption {
      font-size: 0.74rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 直接タップで外部サイトへ飛べるハイパーリンク欄 */
    .hyperlink-bar {
      background: var(--bg-card);
      border: 1px solid rgba(0, 255, 170, 0.35);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hyperlink-label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--green);
      margin-right: 2px;
    }

    .hyperlink-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      min-height: 36px;
      border-radius: 10px;
      background: rgba(0, 255, 170, 0.12);
      border: 1px solid rgba(0, 255, 170, 0.48);
      color: #e6fff6;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .hyperlink-btn:active {
      background: rgba(0, 255, 170, 0.25);
      transform: scale(0.97);
    }

    /* チャット表示エリア */
    .chat-panel {
      flex: 1;
      min-height: 140px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 92%;
      border-radius: 12px;
      padding: 10px 13px;
      line-height: 1.6;
      font-size: 0.92rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .msg-meta {
      font-size: 0.7rem;
      font-weight: 700;
      opacity: 0.9;
    }

    .speak-mini-btn {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: var(--cyan);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .speak-mini-btn:active {
      transform: scale(0.95);
    }

    .msg.hayato {
      align-self: flex-start;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.28);
    }

    .msg.hayato .msg-meta {
      color: var(--cyan);
    }

    .msg.user {
      align-self: flex-end;
      background: rgba(26, 109, 255, 0.22);
      border: 1px solid rgba(110, 170, 255, 0.4);
    }

    .msg.user .msg-meta {
      color: #9ec5ff;
      text-align: right;
    }

    .msg.error {
      align-self: flex-start;
      background: rgba(255, 77, 121, 0.12);
      border: 1px solid rgba(255, 77, 121, 0.5);
      color: #ffd6e0;
    }

    .msg.error .msg-meta {
      color: var(--red);
    }

    /* 定型質問＋入力エリア */
    .composer {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quick-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .quick-list::-webkit-scrollbar {
      display: none;
    }

    .quick-btn {
      flex: 0 0 auto;
      background: rgba(0, 240, 255, 0.09);
      border: 1px solid rgba(0, 240, 255, 0.36);
      color: var(--text-main);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 0.78rem;
      font-weight: 700;
      min-height: 36px;
      cursor: pointer;
      white-space: nowrap;
    }

    .quick-btn:active {
      background: rgba(0, 240, 255, 0.24);
      transform: scale(0.97);
    }

    .composer-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .mic-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0 10px;
      font-size: 0.85rem;
    }

    .prompt-input {
      flex: 1;
      min-width: 0;
      background: var(--bg-sub);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
      font-size: 16px;
      color: var(--text-main);
      outline: none;
    }

    .prompt-input:focus {
      border-color: var(--border-strong);
    }

    .send-btn {
      min-width: 72px;
      min-height: 44px;
      padding: 0 12px;
      font-size: 0.9rem;
    }

    .helper-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text-sub);
      flex-wrap: wrap;
    }

    /* APIキー設定モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 18, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .modal-text {
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--text-sub);
    }

    .key-input {
      width: 100%;
      background: var(--bg-sub);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 16px;
      color: var(--text-main);
      outline: none;
    }

    .key-input:focus {
      border-color: var(--border-strong);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .modal-actions .btn-danger {
      margin-right: auto;
    }

    @media (max-width: 480px) {
      .top-bar {
        padding: 9px 10px;
      }
      .brand-title {
        font-size: 0.94rem;
      }
      .msg {
        max-width: 96%;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-group">
        <div class="brand-title">
          <span>AIハヤト</span>
          <span class="status-pill" id="keyStatusPill">キー未設定</span>
        </div>
        <div class="brand-sub" id="subStatusText">音声事前起動＋直接ハイパーリンク</div>
      </div>

      <div class="controls-right">
        <select class="model-select" id="modelSelect" aria-label="使用モデル選択">
          <option value="gemini-3.8-flash">gemini-3.8-flash</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
        </select>
        <button class="btn" id="voiceToggleBtn" type="button" aria-label="音声読み上げ切り替え">🔊 音声ON</button>
        <button class="btn" id="openKeyModalBtn" type="button">🔑 API設定</button>
        <button class="btn" id="clearChatBtn" type="button">履歴消去</button>
      </div>
    </header>

    <!-- 軽量SVGイラスト表示（常時アニメなし・状態変化時のみ切替） -->
    <section class="avatar-strip" aria-label="AIハヤト状態表示">
      <div class="avatar-svg-box">
        <svg id="hayatoSvg" width="46" height="46" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AIハヤトのアイコン">
          <circle id="svgRing" cx="24" cy="24" r="21" stroke="#00f0ff" stroke-width="2" />
          <path d="M12 20C12 13.5 17.2 9 24 9C30.8 9 36 13.5 36 20L34.5 23C34 16.5 29.8 13 24 13C18.2 13 14 16.5 13.5 23L12 20Z" fill="#eef7ff" />
          <path d="M14 21C14 27.5 18.4 32.5 24 32.5C29.6 32.5 34 27.5 34 21" stroke="#eef7ff" stroke-width="2.2" stroke-linecap="round" />
          <line x1="16.5" y1="20.5" x2="21.5" y2="20.5" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" />
          <line x1="26.5" y1="20.5" x2="31.5" y2="20.5" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" />
          <path id="svgMouth" d="M20.5 27.5H27.5" stroke="#eef7ff" stroke-width="2" stroke-linecap="round" />
          <path d="M11 41C13 36.5 18 34.5 24 34.5C30 34.5 35 36.5 37 41" fill="#182c4f" stroke="#00f0ff" stroke-width="1.6" />
        </svg>
      </div>
      <div class="avatar-info">
        <div class="avatar-name-row">
          <span class="avatar-name">HAYATO // CONSOLE</span>
          <span class="avatar-state-tag" id="avatarStateTag">待機中</span>
        </div>
        <div class="avatar-caption" id="avatarCaption">送信操作時に音声エンジンを事前起動する設定です、殿。</div>
      </div>
    </section>

    <!-- 直接タップで外部サイトへ飛べるハイパーリンク欄 -->
    <nav class="hyperlink-bar" aria-label="外部サイト直接リンク">
      <span class="hyperlink-label">外部リンク:</span>
      <a class="hyperlink-btn" href="https://www.jma.go.jp/bosai/forecast/" target="_blank" rel="noopener noreferrer">
        🌐 気象庁・天気を開く ↗
      </a>
      <a class="hyperlink-btn" href="https://transit.yahoo.co.jp/traininfo" target="_blank" rel="noopener noreferrer">
        🚆 鉄道運行状況 ↗
      </a>
    </nav>

    <main class="chat-panel" id="chatPanel" aria-live="polite"></main>

    <section class="composer">
      <div class="quick-list" id="quickList" aria-label="定型質問"></div>

      <div class="composer-row">
        <button class="btn mic-btn" id="micBtn" type="button" aria-label="音声で質問する">🎤 話す</button>
        <input
          type="text"
          class="prompt-input"
          id="promptInput"
          placeholder="殿、ご用件をお聞かせください..."
          autocomplete="off"
        />
        <button class="btn btn-primary send-btn" id="sendBtn" type="button">送信</button>
      </div>
      <div class="helper-row">
        <span id="micSupportHint">🎤を押して話すと自動送信（終了後はマイク停止）</span>
        <span id="activeModelLabel">モデル: gemini-3.8-flash</span>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="keyModal" role="dialog" aria-modal="true" aria-labelledby="keyModalTitle">
    <div class="modal-box">
      <div class="modal-title" id="keyModalTitle">🔑 Gemini APIキー設定</div>
      <p class="modal-text">
        APIキーはこの端末のブラウザ（localStorage）にのみ保存され、画面上には平文で表示しません。
        個人利用の静的配信を前提とした構成のため、公開環境での利用時はキー管理にご注意ください。
      </p>
      <input
        type="password"
        class="key-input"
        id="keyInput"
        placeholder="Gemini APIキーを入力（保存済みの場合は空欄で維持可能）"
        autocomplete="off"
      />
      <div class="modal-actions">
        <button class="btn btn-danger" id="deleteKeyBtn" type="button">キー削除</button>
        <button class="btn" id="closeKeyModalBtn" type="button">閉じる</button>
        <button class="btn btn-primary" id="saveKeyBtn" type="button">保存</button>
      </div>
    </div>
  </div>

  <script>
    const QUICK_PROMPTS = [
      {
        label: "🕒 現在時間",
        prompt: "現在の日時や時間帯を意識したうえで、今の時間帯に無理なく進めるべき行動や段取りを簡潔に教えてください。"
      },
      {
        label: "📋 今日の段取り",
        prompt: "今日を効率よく進めるための段取りと、先回りの優先順位を3つ教えてください。"
      },
      {
        label: "💡 要点整理",
        prompt: "複雑な話を分かりやすく整理して伝えるコツを簡潔に教えてください。"
      },
      {
        label: "🛡️ セキュリティ確認",
        prompt: "日常のネット利用やメール・メッセージで気をつけるべきセキュリティのポイントを教えてください。"
      },
      {
        label: "☕ 気分転換",
        prompt: "少し頭を休めたいときに短時間でリフレッシュできる工夫を教えてください。"
      }
    ];

    const STORAGE_KEY = "ai_hayato_gemini_api_key_v1";
    const STORAGE_MODEL = "ai_hayato_gemini_model_v1";
    const STORAGE_VOICE = "ai_hayato_voice_enabled_v1";

    const SYSTEM_INSTRUCTION = [
      "あなたは私専属のアシスタント「AIハヤト」です。",
      "冷静・有能でプライドがあります。",
      "忠実ですが従順ではなく、必要な意見や懸念、先回りの提案ははっきり述べつつ、最終的には私の意思を尊重してください。",
      "ユーザーのことは「殿」と呼び、音声読み上げでも聞き取りやすいよう簡潔で自然な日本語で回答してください。"
    ].join(" ");

    const chatPanel = document.getElementById("chatPanel");
    const quickList = document.getElementById("quickList");
    const micBtn = document.getElementById("micBtn");
    const micSupportHint = document.getElementById("micSupportHint");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const modelSelect = document.getElementById("modelSelect");
    const activeModelLabel = document.getElementById("activeModelLabel");
    const voiceToggleBtn = document.getElementById("voiceToggleBtn");
    const keyStatusPill = document.getElementById("keyStatusPill");
    const subStatusText = document.getElementById("subStatusText");
    const clearChatBtn = document.getElementById("clearChatBtn");

    const avatarStateTag = document.getElementById("avatarStateTag");
    const avatarCaption = document.getElementById("avatarCaption");
    const svgRing = document.getElementById("svgRing");
    const svgMouth = document.getElementById("svgMouth");

    const keyModal = document.getElementById("keyModal");
    const openKeyModalBtn = document.getElementById("openKeyModalBtn");
    const closeKeyModalBtn = document.getElementById("closeKeyModalBtn");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const deleteKeyBtn = document.getElementById("deleteKeyBtn");
    const keyInput = document.getElementById("keyInput");

    let apiKey = (localStorage.getItem(STORAGE_KEY) || "").trim();
    let selectedModel = localStorage.getItem(STORAGE_MODEL) || "gemini-3.8-flash";
    if (!["gemini-3.8-flash", "gemini-3.5-flash-lite"].includes(selectedModel)) {
      selectedModel = "gemini-3.8-flash";
    }
    modelSelect.value = selectedModel;
    activeModelLabel.textContent = `モデル: ${selectedModel}`;

    const savedVoice = localStorage.getItem(STORAGE_VOICE);
    let voiceEnabled = savedVoice === null ? true : savedVoice === "true";

    let isSending = false;
    let isListening = false;
    let recognition = null;
    let speechUnlocked = false;
    const conversationHistory = [];

    function setAvatarVisualState(mode, caption) {
      avatarStateTag.classList.remove("busy", "speaking", "error");
      if (mode === "busy") {
        avatarStateTag.textContent = "応答確認中";
        avatarStateTag.classList.add("busy");
        svgRing.setAttribute("stroke", "#ffd166");
        svgMouth.setAttribute("d", "M21 27.5H27");
        svgMouth.setAttribute("stroke", "#ffd166");
      } else if (mode === "listening") {
        avatarStateTag.textContent = "音声聞き取り中";
        avatarStateTag.classList.add("busy");
        svgRing.setAttribute("stroke", "#ffd166");
        svgMouth.setAttribute("d", "M21.5 27.5C22.5 29 25.5 29 26.5 27.5");
        svgMouth.setAttribute("stroke", "#ffd166");
      } else if (mode === "speaking") {
        avatarStateTag.textContent = "音声出力中";
        avatarStateTag.classList.add("speaking");
        svgRing.setAttribute("stroke", "#00ffaa");
        svgMouth.setAttribute("d", "M20.5 27C22 29.5 26 29.5 27.5 27");
        svgMouth.setAttribute("stroke", "#00ffaa");
      } else if (mode === "error") {
        avatarStateTag.textContent = "要確認";
        avatarStateTag.classList.add("error");
        svgRing.setAttribute("stroke", "#ff4d79");
        svgMouth.setAttribute("d", "M20.5 28.5C22 26.8 26 26.8 27.5 28.5");
        svgMouth.setAttribute("stroke", "#ff94af");
      } else {
        avatarStateTag.textContent = "待機中";
        svgRing.setAttribute("stroke", "#00f0ff");
        svgMouth.setAttribute("d", "M20.5 27.5H27.5");
        svgMouth.setAttribute("stroke", "#eef7ff");
      }
      if (caption) {
        avatarCaption.textContent = caption;
      }
    }

    function scrollToMessage(targetEl, smooth = true) {
      if (!targetEl || !chatPanel) return;
      try {
        if (typeof targetEl.scrollIntoView === "function") {
          targetEl.scrollIntoView({
            behavior: smooth ? "smooth" : "auto",
            block: "nearest"
          });
        }
        chatPanel.scrollTop = chatPanel.scrollHeight;
      } catch (e) {
        chatPanel.scrollTop = chatPanel.scrollHeight;
      }
    }

    function refreshVoiceButton() {
      if (voiceEnabled) {
        voiceToggleBtn.textContent = "🔊 音声ON";
        voiceToggleBtn.classList.remove("muted");
      } else {
        voiceToggleBtn.textContent = "🔇 音声OFF";
        voiceToggleBtn.classList.add("muted");
      }
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
    }

    // ユーザー操作（送信タップ・定型質問タップ・マイク開始など）の瞬間にSafariの音声エンジンを起こす
    function unlockSpeechEngine() {
      if (!("speechSynthesis" in window)) return;
      try {
        if (typeof window.speechSynthesis.resume === "function") {
          window.speechSynthesis.resume();
        }
        window.speechSynthesis.getVoices();
        if (!speechUnlocked && voiceEnabled) {
          const primer = new SpeechSynthesisUtterance(" ");
          primer.lang = "ja-JP";
          primer.volume = 0;
          primer.rate = 2.0;
          primer.onend = () => {
            speechUnlocked = true;
          };
          window.speechSynthesis.speak(primer);
          speechUnlocked = true;
        }
      } catch (e) {}
    }

    function releaseMicrophone(useAbort = false) {
      isListening = false;
      micBtn.classList.remove("listening");
      micBtn.textContent = "🎤 話す";
      if (!recognition) return;
      try {
        if (useAbort && typeof recognition.abort === "function") {
          recognition.abort();
        } else if (typeof recognition.stop === "function") {
          recognition.stop();
        }
      } catch (e) {}
    }

    function speakJapanese(text, force = false, targetMsgEl = null, delayMs = 0) {
      if (!("speechSynthesis" in window)) return;
      if (!force && !voiceEnabled) return;
      const cleanText = String(text || "")
        .replace(/[*#`_~]/g, "")
        .replace(/\s+/g, " ")
        .trim();
      if (!cleanText) return;

      const runSpeak = () => {
        stopSpeech();
        try {
          if (typeof window.speechSynthesis.resume === "function") {
            window.speechSynthesis.resume();
          }
        } catch (e) {}

        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.lang = "ja-JP";
        utter.rate = 1.05;
        utter.pitch = 1.0;
        utter.volume = 1.0;

        const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        const jaVoice = voices.find((v) => v && v.lang && v.lang.toLowerCase().startsWith("ja"));
        if (jaVoice) {
          utter.voice = jaVoice;
        }

        utter.onstart = () => {
          speechUnlocked = true;
          subStatusText.textContent = "🔊 読み上げ中...";
          setAvatarVisualState("speaking", "ご返答を読み上げております、殿。");
          scrollToMessage(targetMsgEl || chatPanel.lastElementChild, true);
        };
        utter.onend = () => {
          if (!isSending && !isListening) {
            subStatusText.textContent = "待機中";
            setAvatarVisualState("idle", "読み上げ完了。次の指示をお待ちしております、殿。");
          }
        };
        utter.onerror = () => {
          if (!isSending && !isListening) {
            subStatusText.textContent = "待機中";
            setAvatarVisualState("idle", "待機中でございます、殿。");
          }
        };

        try {
          window.speechSynthesis.speak(utter);
        } catch (e) {}
      };

      if (delayMs > 0) {
        setTimeout(runSpeak, delayMs);
      } else {
        runSpeak();
      }
    }

    if ("speechSynthesis" in window && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function setupSpeechRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        micBtn.disabled = true;
        micBtn.textContent = "🎤 非対応";
        micSupportHint.textContent = "このブラウザでは音声入力非対応のため文字入力をご利用ください";
        return;
      }

      recognition = new SpeechRec();
      recognition.lang = "ja-JP";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("listening");
        micBtn.textContent = "⏹ 停止";
        subStatusText.textContent = "🎤 音声を聞き取り中...";
        setAvatarVisualState("listening", "お話しください、殿。終わりましたらマイクを停止し自動送信します。");
      };

      recognition.onresult = (event) => {
        const transcript = event?.results?.[0]?.[0]?.transcript ? event.results[0][0].transcript.trim() : "";
        releaseMicrophone(true);
        if (transcript) {
          promptInput.value = transcript;
          handleSend(transcript, `🎤 ${transcript}`, true);
        }
      };

      recognition.onerror = (event) => {
        const errCode = event?.error || "";
        releaseMicrophone(true);
        if (errCode === "not-allowed" || errCode === "service-not-allowed") {
          appendMessage("error", "マイクの使用が許可されていません。Safariのマイク設定をご確認ください、殿。");
        } else if (errCode !== "aborted" && errCode !== "no-speech") {
          appendMessage("error", `音声認識で問題が発生しました（${errCode}）。文字入力でも送信できます。`);
        }
        if (!isSending) {
          subStatusText.textContent = "待機中";
          setAvatarVisualState("idle", "待機中でございます、殿。");
        }
      };

      recognition.onend = () => {
        releaseMicrophone(false);
        if (!isSending) {
          subStatusText.textContent = "待機中";
          setAvatarVisualState("idle", "待機中でございます、殿。");
        }
      };
    }

    micBtn.addEventListener("click", () => {
      if (!recognition || isSending) return;
      unlockSpeechEngine();
      stopSpeech();
      if (isListening) {
        releaseMicrophone(true);
        if (!isSending) {
          subStatusText.textContent = "待機中";
          setAvatarVisualState("idle", "マイクを停止しました、殿。");
        }
        return;
      }
      try {
        recognition.start();
      } catch (e) {
        releaseMicrophone(true);
        appendMessage("error", "マイクを起動できませんでした。少し待ってから再度お試しください、殿。");
      }
    });

    function refreshKeyStatus() {
      if (apiKey) {
        keyStatusPill.textContent = "キー保存済み";
        keyStatusPill.classList.add("ready");
        openKeyModalBtn.textContent = "🔑 API変更";
      } else {
        keyStatusPill.textContent = "キー未設定";
        keyStatusPill.classList.remove("ready");
        openKeyModalBtn.textContent = "🔑 API設定";
      }
    }

    function appendMessage(role, text, metaLabel = "", options = {}) {
      const { allowSpeak = false } = options;
      const box = document.createElement("div");
      box.className = `msg ${role}`;

      const header = document.createElement("div");
      header.className = "msg-header";

      const meta = document.createElement("div");
      meta.className = "msg-meta";
      if (metaLabel) {
        meta.textContent = metaLabel;
      } else if (role === "hayato") {
        meta.textContent = "AIハヤト";
      } else if (role === "user") {
        meta.textContent = "殿";
      } else {
        meta.textContent = "システム通知";
      }

      header.appendChild(meta);

      if (allowSpeak) {
        const speakBtn = document.createElement("button");
        speakBtn.type = "button";
        speakBtn.className = "speak-mini-btn";
        speakBtn.textContent = "🔊 読み上げ";
        speakBtn.addEventListener("click", () => {
          unlockSpeechEngine();
          speakJapanese(body.textContent, true, box, 0);
        });
        header.appendChild(speakBtn);
      }

      const body = document.createElement("div");
      body.textContent = text;

      box.appendChild(header);
      box.appendChild(body);
      chatPanel.appendChild(box);
      scrollToMessage(box, false);
      return body;
    }

    function getCurrentTimeLabel() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const w = ["日", "月", "火", "水", "木", "金", "土"][now.getDay()];
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      return `${y}年${m}月${d}日（${w}）${hh}:${mm}`;
    }

    function buildPromptWithContext(rawPrompt) {
      const timeLabel = getCurrentTimeLabel();
      return `【現在の端末日時】${timeLabel}\n${rawPrompt}`;
    }

    function renderQuickButtons() {
      quickList.innerHTML = "";
      QUICK_PROMPTS.forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "quick-btn";
        btn.textContent = item.label;
        btn.title = item.prompt;
        btn.addEventListener("click", () => {
          unlockSpeechEngine();
          handleSend(item.prompt, item.label, false);
        });
        quickList.appendChild(btn);
      });
    }

    function initGreeting() {
      chatPanel.innerHTML = "";
      setAvatarVisualState("idle", "送信操作時に音声エンジンを事前起動する設定です、殿。");
      appendMessage(
        "hayato",
        "AIハヤトです、殿。送信タップ時にSafariの音声エンジンを先に起こしておく改善を組み込みました。ご用件をお申し付けください。",
        "AIハヤト",
        { allowSpeak: false }
      );
    }

    refreshVoiceButton();
    refreshKeyStatus();
    setupSpeechRecognition();
    renderQuickButtons();
    initGreeting();

    voiceToggleBtn.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      localStorage.setItem(STORAGE_VOICE, String(voiceEnabled));
      refreshVoiceButton();
      if (voiceEnabled) {
        unlockSpeechEngine();
        speakJapanese("音声読み上げをオンにしました、殿。", true, chatPanel.lastElementChild, 0);
      } else {
        stopSpeech();
        if (!isSending && !isListening) {
          subStatusText.textContent = "待機中（音声OFF）";
          setAvatarVisualState("idle", "音声読み上げオフで待機中です、殿。");
        }
      }
    });

    modelSelect.addEventListener("change", () => {
      selectedModel = modelSelect.value;
      localStorage.setItem(STORAGE_MODEL, selectedModel);
      activeModelLabel.textContent = `モデル: ${selectedModel}`;
    });

    openKeyModalBtn.addEventListener("click", () => {
      keyInput.value = "";
      keyInput.placeholder = apiKey
        ? "保存済みキーあり（新しいキーを入力すると上書き）"
        : "Gemini APIキーを入力してください";
      keyModal.classList.add("open");
      setTimeout(() => keyInput.focus(), 50);
    });

    closeKeyModalBtn.addEventListener("click", () => {
      keyModal.classList.remove("open");
    });

    keyModal.addEventListener("click", (e) => {
      if (e.target === keyModal) {
        keyModal.classList.remove("open");
      }
    });

    saveKeyBtn.addEventListener("click", () => {
      unlockSpeechEngine();
      const entered = keyInput.value.trim();
      if (!entered && !apiKey) {
        appendMessage("error", "APIキーが入力されていません。有効なキーを入力してから保存してください。");
        setAvatarVisualState("error", "APIキー未入力のため保存できませんでした。");
        return;
      }
      if (entered) {
        apiKey = entered;
        localStorage.setItem(STORAGE_KEY, apiKey);
      }
      keyInput.value = "";
      refreshKeyStatus();
      keyModal.classList.remove("open");
      const msg = "APIキーの保存を確認しました、殿。いつでもご用件をお申し付けください。";
      const bodyEl = appendMessage("hayato", msg, "AIハヤト", { allowSpeak: true });
      speakJapanese(msg, false, bodyEl.parentElement, 0);
    });

    deleteKeyBtn.addEventListener("click", () => {
      apiKey = "";
      keyInput.value = "";
      localStorage.removeItem(STORAGE_KEY);
      refreshKeyStatus();
      keyModal.classList.remove("open");
      stopSpeech();
      releaseMicrophone(true);
      setAvatarVisualState("idle", "APIキーを削除しました。再設定をお待ちしております。");
      appendMessage("hayato", "保存されていたAPIキーを削除しました。再び接続される際は「API設定」からご入力ください。");
    });

    clearChatBtn.addEventListener("click", () => {
      stopSpeech();
      releaseMicrophone(true);
      conversationHistory.length = 0;
      initGreeting();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && isListening) {
        releaseMicrophone(true);
      }
    });

    function formatFriendlyError(rawMessage, statusCode) {
      const msg = String(rawMessage || "");
      if (statusCode === 429 || /quota|rate|resource_exhausted/i.test(msg)) {
        return "本日の利用上限（クォータ）に達したか、短時間の送信制限にかかりました。上限がリセットされるまでお待ちいただくか、別モデル・別キーをご検討ください。";
      }
      if (statusCode === 400 || /api key not valid|invalid argument/i.test(msg)) {
        return "APIキーまたはリクエスト内容が無効です。「API変更」から正しいAPIキーかご確認ください。";
      }
      if (statusCode === 403) {
        return "APIキーの権限または利用制限により拒否されました。Google AI Studio側の設定をご確認ください。";
      }
      if (/load failed|failed to fetch|network/i.test(msg)) {
        return "ネットワーク通信が途中で切断されました。電波状況をご確認のうえ、少し時間を置いて再送してください。";
      }
      return `通信エラーが発生しました（${msg || "詳細不明"}）。`;
    }

    async function callGeminiOnce(model, contents) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: SYSTEM_INSTRUCTION }]
          },
          contents,
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 600
          }
        })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const err = new Error(data?.error?.message || `HTTP ${response.status}`);
        err.status = response.status;
        throw err;
      }

      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) {
        throw new Error("空の応答が返されました。");
      }
      return text.trim();
    }

    async function requestGeminiWithSingleRetry(model, contents, thinkingBodyEl) {
      try {
        return await callGeminiOnce(model, contents);
      } catch (firstErr) {
        const isTransientServerBusy =
          firstErr.status === 503 ||
          firstErr.status === 500 ||
          /high demand|overloaded|temporarily unavailable/i.test(firstErr.message || "");

        if (isTransientServerBusy) {
          subStatusText.textContent = "サーバー混雑のため1回のみ再試行中...";
          setAvatarVisualState("busy", "サーバー混雑のため1回だけ再試行中です、殿。");
          thinkingBodyEl.textContent = "サーバーが混み合っております。1回だけ再試行いたします、殿...";
          await new Promise((r) => setTimeout(r, 1200));
          return await callGeminiOnce(model, contents);
        }
        throw firstErr;
      }
    }

    async function handleSend(overrideText = "", displayLabel = "", fromVoice = false) {
      if (isSending) return;
      const userText = (overrideText || promptInput.value).trim();
      if (!userText) return;

      if (!apiKey) {
        appendMessage(
          "error",
          "APIキーが設定されていません。右上の「API設定」からGemini APIキーを保存してから送信してください、殿。"
        );
        setAvatarVisualState("error", "APIキーが未設定です。右上のAPI設定をご確認ください。");
        return;
      }

      unlockSpeechEngine();
      stopSpeech();
      releaseMicrophone(true);
      isSending = true;
      sendBtn.disabled = true;
      micBtn.disabled = true;
      promptInput.disabled = true;
      if (!overrideText) {
        promptInput.value = "";
      }
      subStatusText.textContent = `${selectedModel} に送信中...`;
      setAvatarVisualState("busy", `${selectedModel} へ照会中です、殿。`);

      appendMessage("user", displayLabel ? `${displayLabel}（${getCurrentTimeLabel()}）` : userText);
      const thinkingBody = appendMessage("hayato", "確認中です、少々お待ちください...", `AIハヤト (${selectedModel})`);
      const replyBoxEl = thinkingBody.parentElement;

      const promptForApi = buildPromptWithContext(userText);
      const nextContents = [
        ...conversationHistory.slice(-8),
        { role: "user", parts: [{ text: promptForApi }] }
      ];

      try {
        const replyText = await requestGeminiWithSingleRetry(selectedModel, nextContents, thinkingBody);
        thinkingBody.textContent = replyText;

        const speakBtn = document.createElement("button");
        speakBtn.type = "button";
        speakBtn.className = "speak-mini-btn";
        speakBtn.textContent = "🔊 読み上げ";
        speakBtn.addEventListener("click", () => {
          unlockSpeechEngine();
          speakJapanese(replyText, true, replyBoxEl, 0);
        });
        replyBoxEl.querySelector(".msg-header").appendChild(speakBtn);

        scrollToMessage(replyBoxEl, true);

        conversationHistory.push(
          { role: "user", parts: [{ text: promptForApi }] },
          { role: "model", parts: [{ text: replyText }] }
        );
        subStatusText.textContent = "待機中";
        setAvatarVisualState("idle", "ご返答を表示いたしました、殿。");
        speakJapanese(replyText, false, replyBoxEl, fromVoice ? 350 : 80);
      } catch (err) {
        replyBoxEl.remove();
        appendMessage("error", formatFriendlyError(err?.message, err?.status));
        subStatusText.textContent = "エラー確認";
        setAvatarVisualState("error", "通信またはモデル応答に問題が発生しました。");
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        if (recognition) micBtn.disabled = false;
        promptInput.disabled = false;
        if (!overrideText) {
          promptInput.focus();
        }
      }
    }

    sendBtn.addEventListener("click", () => {
      unlockSpeechEngine();
      handleSend("", "", false);
    });

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        unlockSpeechEngine();
        handleSend("", "", false);
      }
    });
  </script>
</body>
