<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AIハヤト - 基本音声＋定型質問コンソール</title>
  <style>
    :root {
      --bg-main: #070d19;
      --bg-card: #0e1a30;
      --bg-sub: #081122;
      --border: rgba(0, 240, 255, 0.28);
      --border-strong: rgba(0, 240, 255, 0.6);
      --cyan: #00f0ff;
      --green: #00ffaa;
      --red: #ff4d79;
      --amber: #ffd166;
      --text-main: #eef7ff;
      --text-sub: #88accb;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: calc(10px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
      gap: 10px;
      background-image:
        radial-gradient(circle at 50% 15%, rgba(0, 180, 255, 0.12), transparent 55%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ヘッダー */
    .top-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .status-pill.ready {
      background: rgba(0, 255, 170, 0.14);
      color: var(--green);
      border-color: rgba(0, 255, 170, 0.45);
    }

    .brand-sub {
      font-size: 0.74rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .model-select {
      background: var(--bg-sub);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 38px;
      outline: none;
    }

    .btn {
      border: 1px solid var(--border);
      background: rgba(0, 240, 255, 0.1);
      color: var(--text-main);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      min-height: 38px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.muted {
      background: rgba(255, 77, 121, 0.14);
      border-color: rgba(255, 77, 121, 0.45);
      color: #ff94af;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00b8e6, #1a6dff);
      border-color: transparent;
      color: #ffffff;
    }

    .btn-danger {
      background: rgba(255, 77, 121, 0.14);
      border-color: rgba(255, 77, 121, 0.45);
      color: #ff94af;
    }

    /* チャット表示エリア */
    .chat-panel {
      flex: 1;
      min-height: 160px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 92%;
      border-radius: 12px;
      padding: 10px 13px;
      line-height: 1.6;
      font-size: 0.92rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .msg-meta {
      font-size: 0.7rem;
      font-weight: 700;
      opacity: 0.9;
    }

    .speak-mini-btn {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: var(--cyan);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .speak-mini-btn:active {
      transform: scale(0.95);
    }

    .msg.hayato {
      align-self: flex-start;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.28);
    }

    .msg.hayato .msg-meta {
      color: var(--cyan);
    }

    .msg.user {
      align-self: flex-end;
      background: rgba(26, 109, 255, 0.22);
      border: 1px solid rgba(110, 170, 255, 0.4);
    }

    .msg.user .msg-meta {
      color: #9ec5ff;
      text-align: right;
    }

    .msg.error {
      align-self: flex-start;
      background: rgba(255, 77, 121, 0.12);
      border: 1px solid rgba(255, 77, 121, 0.5);
      color: #ffd6e0;
    }

    .msg.error .msg-meta {
      color: var(--red);
    }

    /* 定型質問＋入力エリア */
    .composer {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quick-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .quick-list::-webkit-scrollbar {
      display: none;
    }

    .quick-btn {
      flex: 0 0 auto;
      background: rgba(0, 240, 255, 0.09);
      border: 1px solid rgba(0, 240, 255, 0.36);
      color: var(--text-main);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 0.78rem;
      font-weight: 700;
      min-height: 36px;
      cursor: pointer;
      white-space: nowrap;
    }

    .quick-btn:active {
      background: rgba(0, 240, 255, 0.24);
      transform: scale(0.97);
    }

    .composer-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .prompt-input {
      flex: 1;
      min-width: 0;
      background: var(--bg-sub);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
      font-size: 16px;
      color: var(--text-main);
      outline: none;
    }

    .prompt-input:focus {
      border-color: var(--border-strong);
    }

    .send-btn {
      min-width: 76px;
      min-height: 44px;
      padding: 0 14px;
      font-size: 0.9rem;
    }

    .helper-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text-sub);
      flex-wrap: wrap;
    }

    /* APIキー設定モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 18, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .modal-text {
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--text-sub);
    }

    .key-input {
      width: 100%;
      background: var(--bg-sub);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 16px;
      color: var(--text-main);
      outline: none;
    }

    .key-input:focus {
      border-color: var(--border-strong);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .modal-actions .btn-danger {
      margin-right: auto;
    }

    @media (max-width: 480px) {
      .top-bar {
        padding: 9px 10px;
      }
      .brand-title {
        font-size: 0.94rem;
      }
      .msg {
        max-width: 96%;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-group">
        <div class="brand-title">
          <span>AIハヤト</span>
          <span class="status-pill" id="keyStatusPill">キー未設定</span>
        </div>
        <div class="brand-sub" id="subStatusText">基本音声＋定型質問モード</div>
      </div>

      <div class="controls-right">
        <select class="model-select" id="modelSelect" aria-label="使用モデル選択">
          <option value="gemini-3.8-flash">gemini-3.8-flash</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
        </select>
        <button class="btn" id="voiceToggleBtn" type="button" aria-label="音声読み上げ切り替え">🔊 音声ON</button>
        <button class="btn" id="openKeyModalBtn" type="button">🔑 API設定</button>
        <button class="btn" id="clearChatBtn" type="button">履歴消去</button>
      </div>
    </header>

    <main class="chat-panel" id="chatPanel" aria-live="polite"></main>

    <section class="composer">
      <!-- 定型質問ボタン一覧（下のスクリプト内 QUICK_PROMPTS で自由に編集可能） -->
      <div class="quick-list" id="quickList" aria-label="定型質問"></div>

      <div class="composer-row">
        <input
          type="text"
          class="prompt-input"
          id="promptInput"
          placeholder="殿、ご用件をお聞かせください..."
          autocomplete="off"
        />
        <button class="btn btn-primary send-btn" id="sendBtn" type="button">送信</button>
      </div>
      <div class="helper-row">
        <span>送信は1回のみ実行（混雑時のみ最大1回再試行）</span>
        <span id="activeModelLabel">モデル: gemini-3.8-flash</span>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="keyModal" role="dialog" aria-modal="true" aria-labelledby="keyModalTitle">
    <div class="modal-box">
      <div class="modal-title" id="keyModalTitle">🔑 Gemini APIキー設定</div>
      <p class="modal-text">
        APIキーはこの端末のブラウザ（localStorage）にのみ保存され、画面上には平文で表示しません。
        個人利用の静的配信を前提とした構成のため、公開環境での利用時はキー管理にご注意ください。
      </p>
      <input
        type="password"
        class="key-input"
        id="keyInput"
        placeholder="Gemini APIキーを入力（保存済みの場合は空欄で維持可能）"
        autocomplete="off"
      />
      <div class="modal-actions">
        <button class="btn btn-danger" id="deleteKeyBtn" type="button">キー削除</button>
        <button class="btn" id="closeKeyModalBtn" type="button">閉じる</button>
        <button class="btn btn-primary" id="saveKeyBtn" type="button">保存</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ★ よく使う定型質問ボタンは、ここの配列を書き換えるだけで自由に決められます
    // label: ボタンに表示する短い名前
    // prompt: ボタンを押したときにAIハヤトへ送る実際の質問文
    // =========================================================================
    const QUICK_PROMPTS = [
      {
        label: "🌤️ 明日の天気",
        prompt: "明日の天気について、リアルタイムの気象情報が参照できない前提を踏まえつつ、外出や予定を組む際に確認すべきポイントと先回りの助言を教えてください。"
      },
      {
        label: "🕒 現在時間",
        prompt: "現在の日時や時間帯を意識したうえで、今の時間帯に無理なく進めるべき行動や段取りを簡潔に教えてください。"
      },
      {
        label: "📋 今日の段取り",
        prompt: "今日を効率よく進めるための段取りと、先回りの優先順位を3つ教えてください。"
      },
      {
        label: "💡 要点整理",
        prompt: "複雑な話を分かりやすく整理して伝えるコツを簡潔に教えてください。"
      },
      {
        label: "🛡️ セキュリティ確認",
        prompt: "日常のネット利用やメール・メッセージで気をつけるべきセキュリティのポイントを教えてください。"
      },
      {
        label: "☕ 気分転換",
        prompt: "少し頭を休めたいときに短時間でリフレッシュできる工夫を教えてください。"
      }
    ];

    const STORAGE_KEY = "ai_hayato_gemini_api_key_v1";
    const STORAGE_MODEL = "ai_hayato_gemini_model_v1";
    const STORAGE_VOICE = "ai_hayato_voice_enabled_v1";

    const SYSTEM_INSTRUCTION = [
      "あなたは私専属のアシスタント「AIハヤト」です。",
      "冷静・有能でプライドがあります。",
      "忠実ですが従順ではなく、必要な意見や懸念、先回りの提案ははっきり述べつつ、最終的には私の意思を尊重してください。",
      "ユーザーのことは「殿」と呼び、音声読み上げでも聞き取りやすいよう簡潔で自然な日本語で回答してください。"
    ].join(" ");

    const chatPanel = document.getElementById("chatPanel");
    const quickList = document.getElementById("quickList");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const modelSelect = document.getElementById("modelSelect");
    const activeModelLabel = document.getElementById("activeModelLabel");
    const voiceToggleBtn = document.getElementById("voiceToggleBtn");
    const keyStatusPill = document.getElementById("keyStatusPill");
    const subStatusText = document.getElementById("subStatusText");
    const clearChatBtn = document.getElementById("clearChatBtn");

    const keyModal = document.getElementById("keyModal");
    const openKeyModalBtn = document.getElementById("openKeyModalBtn");
    const closeKeyModalBtn = document.getElementById("closeKeyModalBtn");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const deleteKeyBtn = document.getElementById("deleteKeyBtn");
    const keyInput = document.getElementById("keyInput");

    let apiKey = (localStorage.getItem(STORAGE_KEY) || "").trim();
    let selectedModel = localStorage.getItem(STORAGE_MODEL) || "gemini-3.8-flash";
    if (!["gemini-3.8-flash", "gemini-3.5-flash-lite"].includes(selectedModel)) {
      selectedModel = "gemini-3.8-flash";
    }
    modelSelect.value = selectedModel;
    activeModelLabel.textContent = `モデル: ${selectedModel}`;

    const savedVoice = localStorage.getItem(STORAGE_VOICE);
    let voiceEnabled = savedVoice === null ? true : savedVoice === "true";

    let isSending = false;
    const conversationHistory = [];

    function refreshVoiceButton() {
      if (voiceEnabled) {
        voiceToggleBtn.textContent = "🔊 音声ON";
        voiceToggleBtn.classList.remove("muted");
      } else {
        voiceToggleBtn.textContent = "🔇 音声OFF";
        voiceToggleBtn.classList.add("muted");
      }
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
    }

    function speakJapanese(text, force = false) {
      if (!("speechSynthesis" in window)) return;
      if (!force && !voiceEnabled) return;
      const cleanText = String(text || "")
        .replace(/[*#`_~]/g, "")
        .replace(/\s+/g, " ")
        .trim();
      if (!cleanText) return;

      stopSpeech();
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = "ja-JP";
      utter.rate = 1.05;
      utter.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const jaVoice = voices.find((v) => v && v.lang && v.lang.toLowerCase().startsWith("ja"));
      if (jaVoice) {
        utter.voice = jaVoice;
      }

      utter.onstart = () => {
        subStatusText.textContent = "🔊 読み上げ中...";
      };
      utter.onend = () => {
        if (!isSending) subStatusText.textContent = "待機中";
      };
      utter.onerror = () => {
        if (!isSending) subStatusText.textContent = "待機中";
      };

      try {
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    if ("speechSynthesis" in window && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function refreshKeyStatus() {
      if (apiKey) {
        keyStatusPill.textContent = "キー保存済み";
        keyStatusPill.classList.add("ready");
        openKeyModalBtn.textContent = "🔑 API変更";
      } else {
        keyStatusPill.textContent = "キー未設定";
        keyStatusPill.classList.remove("ready");
        openKeyModalBtn.textContent = "🔑 API設定";
      }
    }

    function appendMessage(role, text, metaLabel = "", options = {}) {
      const { allowSpeak = false } = options;
      const box = document.createElement("div");
      box.className = `msg ${role}`;

      const header = document.createElement("div");
      header.className = "msg-header";

      const meta = document.createElement("div");
      meta.className = "msg-meta";
      if (metaLabel) {
        meta.textContent = metaLabel;
      } else if (role === "hayato") {
        meta.textContent = "AIハヤト";
      } else if (role === "user") {
        meta.textContent = "殿";
      } else {
        meta.textContent = "システム通知";
      }

      header.appendChild(meta);

      if (allowSpeak) {
        const speakBtn = document.createElement("button");
        speakBtn.type = "button";
        speakBtn.className = "speak-mini-btn";
        speakBtn.textContent = "🔊 読み上げ";
        speakBtn.addEventListener("click", () => {
          speakJapanese(body.textContent, true);
        });
        header.appendChild(speakBtn);
      }

      const body = document.createElement("div");
      body.textContent = text;

      box.appendChild(header);
      box.appendChild(body);
      chatPanel.appendChild(box);
      chatPanel.scrollTop = chatPanel.scrollHeight;
      return body;
    }

    function getCurrentTimeLabel() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const w = ["日", "月", "火", "水", "木", "金", "土"][now.getDay()];
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      return `${y}年${m}月${d}日（${w}）${hh}:${mm}`;
    }

    function buildPromptWithContext(rawPrompt) {
      const timeLabel = getCurrentTimeLabel();
      return `【現在の端末日時】${timeLabel}\n${rawPrompt}`;
    }

    function renderQuickButtons() {
      quickList.innerHTML = "";
      QUICK_PROMPTS.forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "quick-btn";
        btn.textContent = item.label;
        btn.title = item.prompt;
        btn.addEventListener("click", () => {
          handleSend(item.prompt, item.label);
        });
        quickList.appendChild(btn);
      });
    }

    function initGreeting() {
      chatPanel.innerHTML = "";
      appendMessage(
        "hayato",
        "AIハヤトです、殿。先頭に「明日の天気」と「現在時間」の定型質問ボタンを追加いたしました。ご用件をお申し付けください。",
        "AIハヤト",
        { allowSpeak: false }
      );
    }

    refreshVoiceButton();
    refreshKeyStatus();
    renderQuickButtons();
    initGreeting();

    voiceToggleBtn.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      localStorage.setItem(STORAGE_VOICE, String(voiceEnabled));
      refreshVoiceButton();
      if (voiceEnabled) {
        speakJapanese("音声読み上げをオンにしました、殿。", true);
      } else {
        stopSpeech();
        if (!isSending) subStatusText.textContent = "待機中（音声OFF）";
      }
    });

    modelSelect.addEventListener("change", () => {
      selectedModel = modelSelect.value;
      localStorage.setItem(STORAGE_MODEL, selectedModel);
      activeModelLabel.textContent = `モデル: ${selectedModel}`;
    });

    openKeyModalBtn.addEventListener("click", () => {
      keyInput.value = "";
      keyInput.placeholder = apiKey
        ? "保存済みキーあり（新しいキーを入力すると上書き）"
        : "Gemini APIキーを入力してください";
      keyModal.classList.add("open");
      setTimeout(() => keyInput.focus(), 50);
    });

    closeKeyModalBtn.addEventListener("click", () => {
      keyModal.classList.remove("open");
    });

    keyModal.addEventListener("click", (e) => {
      if (e.target === keyModal) {
        keyModal.classList.remove("open");
      }
    });

    saveKeyBtn.addEventListener("click", () => {
      const entered = keyInput.value.trim();
      if (!entered && !apiKey) {
        appendMessage("error", "APIキーが入力されていません。有効なキーを入力してから保存してください。");
        return;
      }
      if (entered) {
        apiKey = entered;
        localStorage.setItem(STORAGE_KEY, apiKey);
      }
      keyInput.value = "";
      refreshKeyStatus();
      keyModal.classList.remove("open");
      const msg = "APIキーの保存を確認しました、殿。いつでもご用件をお申し付けください。";
      appendMessage("hayato", msg, "AIハヤト", { allowSpeak: true });
      speakJapanese(msg);
    });

    deleteKeyBtn.addEventListener("click", () => {
      apiKey = "";
      keyInput.value = "";
      localStorage.removeItem(STORAGE_KEY);
      refreshKeyStatus();
      keyModal.classList.remove("open");
      stopSpeech();
      appendMessage("hayato", "保存されていたAPIキーを削除しました。再び接続される際は「API設定」からご入力ください。");
    });

    clearChatBtn.addEventListener("click", () => {
      stopSpeech();
      conversationHistory.length = 0;
      initGreeting();
    });

    function formatFriendlyError(rawMessage, statusCode) {
      const msg = String(rawMessage || "");
      if (statusCode === 429 || /quota|rate|resource_exhausted/i.test(msg)) {
        return "本日の利用上限（クォータ）に達したか、短時間の送信制限にかかりました。上限がリセットされるまでお待ちいただくか、別モデル・別キーをご検討ください。";
      }
      if (statusCode === 400 || /api key not valid|invalid argument/i.test(msg)) {
        return "APIキーまたはリクエスト内容が無効です。「API変更」から正しいAPIキーかご確認ください。";
      }
      if (statusCode === 403) {
        return "APIキーの権限または利用制限により拒否されました。Google AI Studio側の設定をご確認ください。";
      }
      if (/load failed|failed to fetch|network/i.test(msg)) {
        return "ネットワーク通信が途中で切断されました。電波状況をご確認のうえ、少し時間を置いて再送してください。";
      }
      return `通信エラーが発生しました（${msg || "詳細不明"}）。`;
    }

    async function callGeminiOnce(model, contents) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: SYSTEM_INSTRUCTION }]
          },
          contents,
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 600
          }
        })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const err = new Error(data?.error?.message || `HTTP ${response.status}`);
        err.status = response.status;
        throw err;
      }

      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) {
        throw new Error("空の応答が返されました。");
      }
      return text.trim();
    }

    async function requestGeminiWithSingleRetry(model, contents, thinkingBodyEl) {
      try {
        return await callGeminiOnce(model, contents);
      } catch (firstErr) {
        const isTransientServerBusy =
          firstErr.status === 503 ||
          firstErr.status === 500 ||
          /high demand|overloaded|temporarily unavailable/i.test(firstErr.message || "");

        if (isTransientServerBusy) {
          subStatusText.textContent = "サーバー混雑のため1回のみ再試行中...";
          thinkingBodyEl.textContent = "サーバーが混み合っております。1回だけ再試行いたします、殿...";
          await new Promise((r) => setTimeout(r, 1200));
          return await callGeminiOnce(model, contents);
        }
        throw firstErr;
      }
    }

    async function handleSend(overrideText = "", displayLabel = "") {
      if (isSending) return;
      const userText = (overrideText || promptInput.value).trim();
      if (!userText) return;

      if (!apiKey) {
        appendMessage(
          "error",
          "APIキーが設定されていません。右上の「API設定」からGemini APIキーを保存してから送信してください、殿。"
        );
        return;
      }

      stopSpeech();
      isSending = true;
      sendBtn.disabled = true;
      promptInput.disabled = true;
      if (!overrideText) {
        promptInput.value = "";
      }
      subStatusText.textContent = `${selectedModel} に送信中...`;

      appendMessage("user", displayLabel ? `${displayLabel}（${getCurrentTimeLabel()}）` : userText);
      const thinkingBody = appendMessage("hayato", "確認中です、少々お待ちください...", `AIハヤト (${selectedModel})`);

      const promptForApi = buildPromptWithContext(userText);
      const nextContents = [
        ...conversationHistory.slice(-8),
        { role: "user", parts: [{ text: promptForApi }] }
      ];

      try {
        const replyText = await requestGeminiWithSingleRetry(selectedModel, nextContents, thinkingBody);
        thinkingBody.textContent = replyText;

        const speakBtn = document.createElement("button");
        speakBtn.type = "button";
        speakBtn.className = "speak-mini-btn";
        speakBtn.textContent = "🔊 読み上げ";
        speakBtn.addEventListener("click", () => {
          speakJapanese(replyText, true);
        });
        thinkingBody.parentElement.querySelector(".msg-header").appendChild(speakBtn);

        conversationHistory.push(
          { role: "user", parts: [{ text: promptForApi }] },
          { role: "model", parts: [{ text: replyText }] }
        );
        subStatusText.textContent = "待機中";
        speakJapanese(replyText);
      } catch (err) {
        thinkingBody.parentElement.remove();
        appendMessage("error", formatFriendlyError(err?.message, err?.status));
        subStatusText.textContent = "エラー確認";
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        promptInput.disabled = false;
        if (!overrideText) {
          promptInput.focus();
        }
      }
    }

    sendBtn.addEventListener("click", () => handleSend());

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
</html>
